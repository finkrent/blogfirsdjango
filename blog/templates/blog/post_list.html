{% extends "blog/base.html" %}
{% block content %}
    {% for post in posts %}
        <article class="card bg-base-100 shadow-sm hover:shadow-md transition-shadow duration-200">
            <div class="card-body gap-3">
                <time class="text-xs text-base-content/50 uppercase tracking-widest">
                    {{ post.published_date }}
                </time>
                <h2 class="card-title text-2xl leading-snug">
                    <a href="{% url 'post_detail' pk=post.pk %}" class="hover:opacity-80 transition-opacity">
                        {{ post.title }}
                    </a>
                    
                </h2>
                <p class="text-base-content/75 leading-relaxed text-[15px]">
                    {{ post.text|linebreaksbr }}
                </p>
                <div class="card-actions mt-2">
                    <a href="{% url 'post_detail' pk=post.pk %}" class="btn btn-ghost btn-sm text-primary px-0 hover:bg-transparent hover:underline">
                        Read more →
                    </a>
                </div>
            </div>
        </article>
    {% empty %}
        <div class="text-center py-20 text-base-content/40">
            <p class="text-lg">No posts yet. Check back soon!</p>
        </div>
    {% endfor %}
{% endblock %}
