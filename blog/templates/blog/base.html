{% load static %}
<!DOCTYPE html>
<html data-theme="dark">
    <head>
        <title>DeBLOG</title>
        <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
        <link href="https://cdn.jsdelivr.net/npm/daisyui@5/daisyui.css" rel="stylesheet" type="text/css" />
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="{% static 'css/blog.css' %}">
    </head>
    <body class="bg-base-200 min-h-screen">

        <!-- Header -->
        <header class="bg-primary text-primary-content shadow-md">
            <div class="max-w-3xl mx-auto px-6 py-8">
                <a href="/" class="text-4xl font-bold tracking-tight hover:opacity-80 transition-opacity">
                    f in blog
                </a>
                <p class="mt-1 text-sm opacity-70 font-light italic">thoughts, words & things</p>
            </div>
        </header>

        <!-- Main content -->
        <main class="max-w-3xl mx-auto px-6 py-10">
            <div class="flex flex-col gap-8">
               <div class="col">
                {% block content %}
                {% endblock %}
               </div> 
            </div>
        </main>

    </body>
</html>
